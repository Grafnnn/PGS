<!doctype html>
<html lang="ru" data-theme="light"><head><meta charset="utf-8"><style>a[data-pkg-archive]::after{content:" · в архиве";font-size:.85em;opacity:.75}</style><script defer src="assets/package-links.js"></script><script src="project/config.js"></script><script>/* К1: наборы данных объекта (как на прочих страницах; имя атрибута — переменной A). 1.2.1: наборы «Хода работ» сюда не пишутся — их подгружает atlas-demo.js после первого кадра */(function(){var A="src",P=window.ATLAS_PROJECT||{},L=Array.isArray(P.plugins)?P.plugins:[],X=window.ATLAS_PLUGINS=window.ATLAS_PLUGINS||{},N=[],seen={};for(var i=0;i<L.length;i++){var p=L[i];if(p&&/^[A-Za-z0-9_-]+$/.test(p.name||"")){X[p.name]=Object.assign(X[p.name]||{},{data:p.data||[]});N.push(p.name);}}var pg=(location.pathname.split("/").pop()||"index.html").replace(/\.html$/,"");window.__atlasPluginData=function(defer){for(var i=0;i<N.length;i++){var x=X[N[i]];if(!x||!x.data)continue;for(var j=0;j<x.data.length;j++){var d=x.data[j],u=typeof d==="string"?d:d&&d.src,ps=d&&d.pages;if(!u||seen[u])continue;if(ps&&!ps.some(function(q){return String(q).replace(/\.html$/,"")===pg;}))continue;seen[u]=1;if(document.querySelector("script["+A+"=\""+u+"\"]"))continue;document.write('<script'+(defer?' defer':'')+' '+A+'="'+u+'"><\/script>');}}};if(pg!=="index")window.__atlasPluginData(false);})();</script>
<script>/* 1.2.1: тема — выбор на этой странице (atlas:<объект>:demo), иначе «Фон» главной (atlas:global:view); до первой отрисовки */try{var P=window.ATLAS_PROJECT||{},k=((P.storage&&P.storage.prefix)||("atlas:"+(P.project_id||"default")+":"))+"demo",d=JSON.parse(localStorage.getItem(k))||{},v=JSON.parse(localStorage.getItem("atlas:global:view"))||{},dark=d.theme?d.theme==="dark":v.background==="dark";document.documentElement.dataset.theme=dark?"dark":"light";if(d.hc)document.documentElement.classList.add("demo-hc");}catch(e){}</script>
